<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VF Filhos Lanches</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

header{
    background:#050505;
    border-bottom:1px solid #333;
    padding:15px 4%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:70px;
    height:70px;
    object-fit:contain;
    border-radius:50%;
}

.logo h1{
    font-size:25px;
    color:white;
}

.logo span{
    color:#d9a400;
}

.logo small{
    color:#ddd;
}

.info{
    display:flex;
    gap:25px;
    align-items:center;
    color:#ddd;
    font-size:13px;
}

.info div{
    border-left:1px solid #444;
    padding-left:20px;
}

.whatsapp{
    background:#e50914;
    color:white;
    border:none;
    border-radius:8px;
    padding:13px 18px;
    font-weight:bold;
    cursor:pointer;
}

.hero{
    min-height:280px;
    padding:40px 6%;
    display:flex;
    align-items:center;
    overflow:hidden;

    background:
    linear-gradient(90deg,#050505 10%,rgba(5,5,5,.75),rgba(5,5,5,.15)),
    url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1400&q=80");

    background-size:cover;
    background-position:center;
}

.hero-text{
    max-width:550px;
}

.hero-text h2{
    font-size:48px;
    line-height:1;
}

.hero-text h2 span{
    color:#d9a400;
}

.hero-text p{
    margin-top:15px;
    font-size:16px;
    color:#ddd;
}

.categorias{
    display:flex;
    gap:12px;
    padding:18px 4%;
    overflow-x:auto;
    background:#080808;
}

.categoria{
    min-width:145px;
    padding:14px;
    border:1px solid #444;
    background:#090909;
    color:white;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.categoria.ativa{
    background:#b88600;
    border-color:#d9a400;
}

.categoria:hover{
    border-color:#d9a400;
}

.container{
    width:92%;
    max-width:1400px;
    margin:auto;
}

.titulo{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin:30px 0 18px;
}

.titulo h2{
    font-size:25px;
}

.titulo h2 span{
    color:#d9a400;
}

.titulo p{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.ver-todos{
    color:#d9a400;
    font-size:14px;
}

.produtos{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:#0d0d0d;
    border:1px solid #353535;
    border-radius:10px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#d9a400;
}

.card-img{
    width:100%;
    height:170px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:13px;
}

.card h3{
    font-size:17px;
    margin-bottom:6px;
}

.descricao{
    color:#aaa;
    font-size:12px;
    line-height:1.4;
    min-height:52px;
}

.preco{
    font-size:18px;
    font-weight:bold;
    color:#fff;
    margin:10px 0;
}

.adicionar{
    width:100%;
    border:0;
    background:#e50914;
    color:white;
    padding:11px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.adicionar:hover{
    background:#ff1826;
}

.secao{
    margin-bottom:40px;
}

.breve{
    background:#111;
    border:1px dashed #444;
    padding:30px;
    border-radius:10px;
    text-align:center;
    color:#aaa;
}

footer{
    margin-top:50px;
    padding:30px 5%;
    background:#080808;
    border-top:1px solid #333;
    text-align:center;
    color:#999;
}

footer strong{
    color:#d9a400;
}


/* CELULAR */

@media(max-width:900px){

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    .info{
        display:none;
    }

    .hero{
        min-height:300px;
        padding:30px 20px;
    }

    .hero-text h2{
        font-size:38px;
    }

    .produtos{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    .logo h1{
        font-size:21px;
    }

    .logo img{
        width:60px;
        height:60px;
    }

    .hero{
        min-height:260px;
    }

    .hero-text h2{
        font-size:34px;
    }

    .produtos{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .card-img{
        height:125px;
    }

    .card-content{
        padding:9px;
    }

    .card h3{
        font-size:15px;
    }

    .descricao{
        font-size:11px;
    }

    .preco{
        font-size:16px;
    }

    .adicionar{
        font-size:12px;
        padding:9px 4px;
    }

}

</
